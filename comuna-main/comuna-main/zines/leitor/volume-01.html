
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leitura — Volume 01</title>

    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/reader.css"
    >

</head>


<body class="reader">


<header class="reader-header">

    <a
        href="../../zines.html"
        class="reader-dots"
        aria-label="Voltar aos zines"
    >

        <span></span>
        <span></span>
        <span></span>

    </a>


    <a
        href="../../comuna.html"
        class="reader-comuna"
    >
        comuna
    </a>


    <span>
        ZINE 01
    </span>

</header>



<main class="reader-main">

    <section class="book-area">

        <button
            class="book-arrow previous"
            id="previous"
            aria-label="Página anterior"
        >
            ←
        </button>

        <div class="book">

            <div
                class="book-page"
                id="left-page"
            ></div>

        </div>

        <button
            class="book-arrow next"
            id="next"
            aria-label="Próxima página"
        >
            →
        </button>

    </section>


    <aside class="thumbnails">

        <div
            class="thumbnail-list"
            id="thumbnail-list"
        ></div>

    </aside>

</main>



<footer class="reader-controls">

    <button
        id="control-prev"
        type="button"
        aria-label="Página anterior"
    >
        ←
    </button>


    <span id="page-counter">
        01 / 04
    </span>


    <button
        id="control-next"
        type="button"
        aria-label="Próxima página"
    >
        →
    </button>


    <button
        id="fullscreen"
        type="button"
        aria-label="Tela cheia"
    >
        ⛶
    </button>

</footer>



<script src="../../assets/js/reader.js"></script>

</body>

</html>
